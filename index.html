<style>
  :root {
    --bg: #F2F3F7;
    --surface: #FFFFFF;
    --surface-2: #E9EBF3;
    --ink: #21245C;
    --ink-soft: #62668D;
    --ink-faint: #8A8EAF;
    --line: #DFE2EE;
    --accent: #00ADED;
    --accent-ink: #FFFFFF;
    --shadow: 0 10px 28px rgba(33, 36, 92, .12);
    --shadow-sm: 0 2px 8px rgba(33, 36, 92, .08);
  }
  :root:not([data-theme="light"]) { color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101229;
      --surface: #1B1E42;
      --surface-2: #262A56;
      --ink: #EDEEF6;
      --ink-soft: #A7ABCF;
      --ink-faint: #7C81A8;
      --line: #2E3365;
      --accent: #3AC6F5;
      --accent-ink: #0B1026;
      --shadow: 0 10px 28px rgba(0, 0, 0, .45);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101229;
    --surface: #1B1E42;
    --surface-2: #262A56;
    --ink: #EDEEF6;
    --ink-soft: #A7ABCF;
    --ink-faint: #7C81A8;
    --line: #2E3365;
    --accent: #3AC6F5;
    --accent-ink: #0B1026;
    --shadow: 0 10px 28px rgba(0, 0, 0, .45);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  img { max-width: 100%; }

  .wrap {
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 18px 48px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .wrap-wall { max-width: none; }
  .wrap-tile { max-width: 720px; }

  /* ---- top bar ---- */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .topbar h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink-soft);
  }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    text-decoration: none;
    padding: 6px 10px 6px 4px;
    border-radius: 999px;
  }
  .back:hover { color: var(--ink); }
  .back svg { width: 18px; height: 18px; flex: none; }
  .back:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .theme-btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    width: 42px; height: 42px;
    border-radius: 999px;
    display: grid; place-items: center;
    cursor: pointer; flex: none;
    transition: border-color .15s ease, color .15s ease;
  }
  .theme-btn:hover { color: var(--ink); border-color: var(--ink-faint); }
  .theme-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .theme-btn svg { width: 19px; height: 19px; display: block; }
  :root:not([data-theme="dark"]) .icon-sun { display: none; }
  :root:not([data-theme="dark"]) .icon-moon { display: block; }
  :root[data-theme="dark"] .icon-moon { display: none; }
  :root[data-theme="dark"] .icon-sun { display: block; }

  /* ---- listen link ---- */
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .listen {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    text-decoration: none;
    padding: 6px 4px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .listen:hover { color: var(--ink); }
  .listen:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .listen svg { width: 18px; height: 18px; flex: none; display: block; }

  /* on a phone the word drops and the headphones stand in for it */
  @media (max-width: 560px) {
    .listen span { display: none; }
    .listen { padding: 8px; }
    .switch a { padding: 9px 14px; }
  }


  /* ---- section switch ---- */
  .switch {
    display: inline-flex;
    gap: 4px;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 4px;
  }
  .switch a {
    display: block;
    padding: 9px 18px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 500;
    line-height: 1;
    color: var(--ink-soft);
    text-decoration: none;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
  }
  .switch a:hover { color: var(--ink); }
  .switch a[aria-current="page"] {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: var(--shadow-sm);
  }
  .switch a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- tag filters ---- */
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -4px; }
  .pill {
    appearance: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    line-height: 1;
    padding: 8px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .pill:hover { color: var(--ink); border-color: var(--ink-faint); }
  .pill[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }
  .pill:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* ---- the wall ---- */
  .wall {
    --gap: 4px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: var(--gap);
    width: 100%;
  }
  @media (min-width: 560px) { .wall { --gap: 8px; } }

  /* On a real screen the wall fills the window instead of sitting in a band at the top.
     The cap keeps 5 rows of 16:9 tiles inside the viewport height; margin auto centers
     whatever space is left over. */
  @media (min-width: 900px) {
    .wrap-wall { min-height: 100dvh; padding-block: 18px 24px; }
    .wall {
      max-width: calc(((100dvh - 172px - 4 * var(--gap)) / 5) * 16 / 9 * 7 + 6 * var(--gap));
      margin: auto;
    }
  }

  .tile {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 3px;
    overflow: hidden;
    background: var(--surface-2);
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  @media (min-width: 560px) { .tile { border-radius: 6px; } }
  .tile img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); z-index: 1; }
  .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; z-index: 2; }
  .tile.dim { opacity: .16; filter: grayscale(1); pointer-events: none; }
  .tile.dim:hover { transform: none; box-shadow: none; }

  /* ---- tile page ---- */
  .hero {
    width: 100%;
    aspect-ratio: 1920 / 1080;
    object-fit: cover;
    display: block;
    border-radius: 14px;
    box-shadow: var(--shadow);
    background: var(--surface-2);
  }
  .lead { display: flex; flex-direction: column; gap: 8px; }
  .tag {
    align-self: flex-start;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent);
    text-decoration: none;
  }
  .tag:hover { text-decoration: underline; }
  .tag:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .lead h2 {
    margin: 0;
    font-size: 26px;
    line-height: 1.25;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-wrap: balance;
  }

  .prose { display: flex; flex-direction: column; gap: 16px; max-width: 62ch; }
  .prose p {
    margin: 0;
    font-size: 17px;
    line-height: 1.68;
    font-weight: 300;
    color: var(--ink);
  }

  .pager { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .navbtn {
    display: block;
    width: 100%;
    text-align: center;
    border-radius: 999px;
    padding: 15px 20px;
    font-size: 16px;
    font-weight: 500;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    text-decoration: none;
    transition: border-color .15s ease;
  }
  .navbtn:hover { border-color: var(--ink-faint); }
  .navbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

</style>

<script>
(function () {
  var wall = document.getElementById('wall');
  var filters = document.getElementById('filters');

  function apply(tag) {
    Array.prototype.forEach.call(wall.children, function (el) {
      el.classList.toggle('dim', !!tag && el.dataset.tag !== tag);
    });
    Array.prototype.forEach.call(filters.children, function (b) {
      b.setAttribute('aria-pressed', String((b.dataset.tag || '') === (tag || '')));
    });
  }

  Array.prototype.forEach.call(filters.children, function (b) {
    b.addEventListener('click', function () {
      var tag = b.dataset.tag || '';
      location.hash = tag ? tag : '';
      apply(tag);
    });
  });

  function fromHash() {
    var h = (location.hash || '').replace(/^#/, '');
    var known = Array.prototype.some.call(filters.children, function (b) { return b.dataset.tag === h; });
    apply(known ? h : '');
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();
})();
</script>
<script>
(function () {
  var root = document.documentElement;
  function applyTheme(t) {
    root.setAttribute('data-theme', t);
    try { localStorage.setItem('cw-theme', t); } catch (err) {}
  }
  var saved = 'light';
  try { saved = localStorage.getItem('cw-theme') || 'light'; } catch (err) {}
  applyTheme(saved === 'dark' ? 'dark' : 'light');
  document.getElementById('themeBtn').addEventListener('click', function () {
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();
</script>
